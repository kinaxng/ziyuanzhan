name: Generate DecoTV Base58 Config

on:
  schedule:
    # 每6小时运行一次（UTC时间）
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "generate-b58"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (upstream mirror)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml pypinyin

      - name: Run monitor
        run: |
          cd main
          python monitor.py

      - name: Convert to Base58 DecoTV config
        run: |
          python gh-pages/scripts/convert_to_decotv.py \
            --input main/docs/data/latest.json \
            --output-b58 main/docs/data/decotv.b58

      - name: Update gh-pages
        run: |
          rm -rf gh-pages/docs
          mkdir -p gh-pages/docs/data
          cp main/docs/data/decotv.b58 gh-pages/docs/data/decotv.b58
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "📊 Update DecoTV Base58 config: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
